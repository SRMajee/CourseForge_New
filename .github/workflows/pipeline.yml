name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Integrity Check (Install, Lint, Test)
  # ------------------------------------------------------------------
  test:
    name: Validate Backend Code
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./server

    # 👇 CRITICAL: Override these to work on the CI Host Machine
    env:
      NODE_ENV: test
      # Use 'localhost' instead of 'mongo' because we are not inside docker-compose here
      MONGO_URI: mongodb://localhost:27017/courseforge_test?replicaSet=rs0
      # Provide keys for process.env usage
      OPENAI_API_KEY: sk-mock-key
      TAVILY_API_KEY: mock-tavily-key
      GEMINI_API_KEY: mock-gemini-key
      GROQ_API_KEY: mock-groq-key
      STRIPE_SECRET_KEY: sk_test_mock
      STRIPE_WEBHOOK_SECRET: whsec_mock
      AUTH0_DOMAIN: test.auth0.com
      AUTH0_AUDIENCE: test-audience
      COST_CREATE_COURSE: 50
      COST_CREATE_COURSE_PRO: 100
      COST_REGENERATE_COURSE: 25
      COST_GENERATE_LESSON: 15

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 🟢 Start MongoDB on localhost:27017
      - name: Start MongoDB v6.0
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'
          mongodb-replica-set: rs0

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Project
        run: pnpm build
  # ------------------------------------------------------------------
  # JOB 2: Deploy to Production (Only on Main Branch)
  # ------------------------------------------------------------------
  deploy:
    name: Trigger Render Deploy
    needs: test # Only runs if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Load Secrets into Env Vars
    env:
      API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
      
    steps:
      - name: Deploy API
        if: env.API_HOOK != ''
        run: curl -X POST "$API_HOOK"
      
      - name: Deploy Worker
        if: env.WORKER_HOOK != ''
        run: curl -X POST "$WORKER_HOOK"