name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Integrity Check (Install, Lint, Test)
  # ------------------------------------------------------------------
  test:
    name: Validate Backend Code
    runs-on: ubuntu-latest
    
    # 👇 THIS IS THE MAGIC LINE that makes it work with the "server/" folder
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 🟢 Start MongoDB with Replica Set (Required for Transactions)
      - name: Start MongoDB v6.0
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '6.0'
          mongodb-replica-set: rs0
      - name: Setup Environment
        run: cp .env.test .env
      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Run Tests
        # Runs Jest inside ./server
        run: pnpm test

      - name: Build Project
        # Verifies that TypeScript compiles correctly inside ./server
        run: pnpm build

  # ------------------------------------------------------------------
  # JOB 2: Deploy to Production (Only on Main Branch)
  # ------------------------------------------------------------------
  deploy:
    name: Trigger Render Deploy
    needs: test # Only runs if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    # Load Secrets into Env Vars
    env:
      API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
      
    steps:
      - name: Deploy API
        if: env.API_HOOK != ''
        run: curl -X POST "$API_HOOK"
      
      - name: Deploy Worker
        if: env.WORKER_HOOK != ''
        run: curl -X POST "$WORKER_HOOK"