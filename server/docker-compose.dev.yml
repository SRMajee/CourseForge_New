services:
  # -----------------------------
  # Node.js Backend (Dev Mode)
  # -----------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: text_to_learn_api
    command: pnpm dev
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    volumes:
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json
    depends_on:
      mongo:
        condition: service_healthy # Waits for RS init
      redis:
        condition: service_healthy # 👈 Added Redis dependency
    networks:
      - app_network

  # -----------------------------
  # Local MongoDB
  # -----------------------------
  mongo:
    image: mongo:latest
    container_name: courseforge_mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      MONGO_INITDB_DATABASE: courseforge
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: |
        test $$(mongosh --quiet --eval "try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } catch(e) { rs.status().ok }") -eq 1
      interval: 10s
      start_period: 5s

  # -----------------------------
  # Redis (with Vector Search support)
  # -----------------------------
  redis:
    image: redis/redis-stack-server:latest # 👈 Supports Vector Search & JSON
    container_name: courseforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data: # 👈 Persistent volume for Redis

networks:
  app_network:
    driver: bridge